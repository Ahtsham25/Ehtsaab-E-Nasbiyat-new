name: Build Android APK (احتساب ناصبیت)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 کلاؤڈ ریپو کلون کریں (Checkout Repository)
        uses: actions/checkout@v4

      - name: ☕ Java 21 سیٹ اپ کریں (Set up JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Android SDK سیٹ اپ کریں (Set up Android SDK)
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: 📦 Node.js LTS سیٹ اپ کریں (Set up Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ⚙️ پروجیکٹ پیکجز انسٹال کریں (Install Dependencies)
        run: npm install --legacy-peer-deps || npm install --force

      - name: 🔨 ویب ایپلیکیشن بلڈ کریں (Build Web Assets)
        run: npm run build

      - name: 🤖 Capacitor سنک و کنفیگر کریں (Prepare Capacitor Android)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android
          echo "android.dependency.enforceCheckAarMetadata=false" >> android/gradle.properties
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> android/gradle.properties

      - name: 🛡️ Gradle کی اجازت دیں (Make Gradlew Executable)
        run: |
          cd android
          chmod +x gradlew

      - name: 🚀 اینڈرائیڈ اے پی کے بلڈ کریں (Build Android APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace -Pandroid.dependency.enforceCheckAarMetadata=false

      - name: 📤 اے پی کے فائل اپلوڈ کریں (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-v1.0-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
