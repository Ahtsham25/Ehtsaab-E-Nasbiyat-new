name: Build Android APK (احتساب ناصبیت)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 کلاؤڈ ریپو کلون کریں
        uses: actions/checkout@v4

      - name: ☕ Java 21 سیٹ اپ کریں
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 📱 Android SDK لائسنس قبول کریں
        run: yes | sdkmanager --licenses || true

      - name: 📦 Node.js LTS سیٹ اپ کریں
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ⚙️ پروجیکٹ پیکجز انسٹال کریں
        run: npm install --legacy-peer-deps || npm install --force

      - name: 🔨 ویب ایپلیکیشن بلڈ کریں
        run: npm run build

      - name: 🤖 Capacitor سنک کریں
        run: npx cap sync android

      - name: 🛡️ Gradle کی اجازت دیں
        run: |
          cd android
          chmod +x gradlew

      - name: 🚀 اینڈرائیڈ اے پی کے بلڈ کریں
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 اے پی کے فائل اپلوڈ کریں
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-v1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30