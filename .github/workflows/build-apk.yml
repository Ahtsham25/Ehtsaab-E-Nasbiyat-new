name: Build Android APK (احتساب ناصبیت)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 کلاؤڈ ریپو کلون کریں (Checkout Repository)
        uses: actions/checkout@v4

      - name: ☕ Java 17 سیٹ اپ کریں (Set up JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📦 Node.js LTS سیٹ اپ کریں (Set up Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: ⚙️ پروجیکٹ پیکجز انسٹال کریں (Install Dependencies)
        run: npm install --legacy-peer-deps || npm install --force

      - name: 🔨 ویب ایپلیکیشن بلڈ کریں (Build Web Assets)
        run: npm run build

      - name: 🤖 Capacitor Android تیار کریں (Prepare Capacitor Android)
        run: |
          npx cap add android || true
          npx cap sync android

      - name: 🛡️ Gradle کی اجازت دیں (Make Gradlew Executable)
        run: |
          cd android
          chmod +x gradlew

      - name: 🚀 اینڈرائیڈ اے پی کے بلڈ کریں (Build Android APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📤 اے پی کے فائل اپلوڈ کریں (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Ihtisab-e-Nasbiyat-v1.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
